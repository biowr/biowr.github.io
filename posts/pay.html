    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
      font-size: min(3.712296984vw, 17.819025522px);
      --page: #1e1e1e;
      --surface: #252525;
      --button: #343434;
      --green: #85a72f;
      --text: #f7f7f7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171717; }
    body { color: var(--text); overscroll-behavior: none; }
    button, input { font: inherit; }
    button { color: inherit; border: 0; padding: 0; cursor: pointer; background: transparent; touch-action: manipulation; }
    button:focus-visible { outline: 2px solid #b2d457; outline-offset: 4px; }
    button:disabled { cursor: default; }
    button:not(:disabled):active { filter: brightness(.87); }
    [hidden] { display: none !important; }
    svg { display: block; width: 100%; height: 100%; }
    .app { position: relative; width: 100%; max-width: 480px; height: 100%; height: 100dvh; margin: auto; overflow: hidden; isolation: isolate; background: var(--page); }
    .page { position: absolute; inset: 0; }
    .merchant-page { display: flex; flex-direction: column; }
    .navigation { position: relative; flex: 0 0 4rem; display: flex; align-items: flex-start; justify-content: center; padding-top: .6875rem; }
    .navigation h1 { margin: 0; font-size: 1.0625rem; line-height: 1.5rem; font-weight: 600; }
    .back { position: absolute; top: .4375rem; left: .875rem; width: 2.5rem; height: 2rem; padding: .375rem; }
    .back svg { stroke-width: 1.7; }
    .merchant { flex: 0 0 6.1875rem; padding: 1.375rem 2rem 1.375rem; }
    .merchant h2 { margin: 0; font-size: 1.6875rem; line-height: 2.375rem; font-weight: 600; letter-spacing: -.025rem; }
    .merchant-info { display: flex; align-items: center; gap: .375rem; margin-top: .0625rem; color: #aeaeae; font-size: .65625rem; line-height: 1rem; }
    .chevron { width: .4375rem; height: .4375rem; border-right: .1rem solid currentColor; border-bottom: .1rem solid currentColor; transform: rotate(45deg) translateY(-.125rem); }
    .amount-card { position: relative; flex: 1; min-height: 15rem; padding: 2rem; background: var(--surface); border-top: 1px solid #363636; border-radius: .6875rem .6875rem 0 0; }
    .amount-field { position: relative; display: flex; align-items: flex-start; gap: .375rem; min-height: 3.5rem; }
    .currency { padding-top: .375rem; font-family: "Payment DIN Condensed", sans-serif; font-size: 1.875rem; line-height: 2.75rem; font-weight: 400; font-synthesis: none; }
    .amount-input { width: 100%; min-width: 0; height: 3.5rem; padding: 0; border: 0; border-radius: 0; outline: none; box-shadow: none; appearance: none; -webkit-appearance: none; background: transparent; color: #fff; caret-color: #a5cb45; font-family: "Payment DIN Condensed", sans-serif; font-size: 2.875rem; line-height: 3.5rem; font-weight: 400; font-synthesis: none; }
    .amount-input:focus, .amount-input:focus-visible { border: 0; outline: none; box-shadow: none; background: transparent; }
    .amount-input::selection { background: #5c6a35; }
    .actions { position: absolute; right: .875rem; bottom: max(2.625rem, env(safe-area-inset-bottom)); left: .875rem; display: grid; gap: 1.125rem; }
    .pill { display: flex; align-items: center; justify-content: center; width: 100%; height: 3.5rem; border-radius: 1.75rem; font-size: 1.0625rem; font-weight: 500; }
    .direct { flex-direction: column; gap: 0; background: var(--button); }
    .direct .button-title { font-size: 1.0625rem; line-height: 1.375rem; }
    .direct .button-caption { color: #828282; font-size: .625rem; line-height: .9375rem; font-weight: 400; }
    .login { background: var(--green); }
    .pill:disabled { color: #525252; background: var(--button); }
    .direct:disabled .button-caption { color: #4d4d4d; }
    .overlay { position: absolute; inset: 0; z-index: 10; }
    .scrim { position: absolute; inset: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, .82); }
    .sheet { position: absolute; right: 0; bottom: 0; left: 0; background: var(--surface); border-top: 1px solid #454545; border-radius: .6875rem .6875rem 0 0; animation: rise .2s ease-out; }
    .sheet:focus { outline: none; }
    .choice-sheet { height: 17.75rem; }
    .sheet-header { position: relative; height: 4.1875rem; border-bottom: 1px solid #2f2f2f; }
    .close { position: absolute; display: grid; place-items: center; width: 2.5rem; height: 2.5rem; padding: .6875rem; color: #f0f0f0; }
    .close svg { stroke-width: 1.8; }
    .sheet-header .close { top: .8125rem; right: .8125rem; }
    .pending { display: flex; align-items: center; justify-content: space-between; margin: 1.375rem 2rem 0; font-size: 1.0625rem; line-height: 1.75rem; }
    .pending-amount { color: #a4ca43; font-family: "DIN Alternate", "Arial Narrow", Arial, sans-serif; font-size: 1.5625rem; font-weight: 600; }
    .wechat-button { position: absolute; bottom: 3rem; left: 2rem; width: calc(100% - 4rem); height: 3.6875rem; border-radius: 2rem; display: flex; justify-content: center; align-items: center; gap: .5rem; background: #0eba0f; font-size: 1.25rem; }
    .wechat-icon { width: 1.25rem; height: 1.25rem; }
    .order-page { background: var(--surface); }
    .order-details { display: grid; gap: 1.875rem; margin: 0; padding: 3.75rem 1.8125rem 0 2rem; }
    .detail-row { display: flex; align-items: center; justify-content: space-between; gap: .625rem; min-height: 1.5rem; font-size: 1.0625rem; line-height: 1.5rem; }
    .detail-row dt, .detail-row dd { margin: 0; white-space: nowrap; font-weight: 400; }
    .detail-row dd { text-align: right; letter-spacing: -.03rem; }
    .order-pay { position: absolute; bottom: max(1rem, env(safe-area-inset-bottom)); left: 2rem; width: calc(100% - 3.5rem); height: 3.6875rem; background: #87a72f; border-radius: 2rem; font-size: 1.25rem; }
    .success-page { background: var(--surface); }
    .success-content { height: 100%; overflow-y: auto; padding: 4rem 2rem 11rem; }
    .success-hero { text-align: center; }
    .success-icon { width: 3.25rem; height: 3.25rem; margin: 0 auto 1.125rem; color: #9cc441; }
    .success-title { margin: 0; color: #9cc441; font-size: 1.375rem; line-height: 2rem; font-weight: 500; outline: none; }
    .success-merchant { margin: 1.625rem 0 .5rem; font-size: 1rem; color: #b1b1b1; }
    .success-amount { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 2.625rem; line-height: 3.5rem; font-weight: 500; }
    .success-amount .yuan { margin-right: .25rem; font-size: 1.625rem; }
    .success-details { display: grid; gap: 1.125rem; margin: 2.5rem 0 0; padding-top: 1.75rem; border-top: 1px solid #333; }
    .success-details .detail-row { font-size: .875rem; line-height: 1.5rem; }
    .success-details dt { color: #949494; }
    .success-details dd { white-space: normal; overflow-wrap: anywhere; }
    .success-footer { position: absolute; right: 2rem; bottom: max(2.625rem, env(safe-area-inset-bottom)); left: 2rem; padding-top: 1rem; background: var(--surface); }
    .success-note { margin: 0 0 1rem; color: #888; text-align: center; font-size: .6875rem; }
    .success-finish { background: var(--green); }
    .wallet-overlay .scrim { background: rgba(0, 0, 0, .5); }
    .wallet-sheet { height: 42.1875rem; max-height: 100%; overflow-y: auto; border-top: 0; border-radius: .375rem .375rem 0 0; background: #1a1a1a; color: #d2d2d2; scrollbar-width: none; }
    .wallet-sheet::-webkit-scrollbar { display: none; }
    .wallet-close { top: .9375rem; left: .625rem; color: #cecece; }
    .wallet-heading { height: 12.125rem; margin: 0 1.3125rem; padding-top: 5rem; text-align: center; border-bottom: 1px solid #252525; }
    .wallet-heading h2 { margin: 0 0 .625rem; font-size: 1.1875rem; line-height: 1.75rem; font-weight: 400; }
    .wallet-price { display: flex; align-items: baseline; justify-content: center; gap: .375rem; color: #d2d2d2; font-family: "DIN Alternate", "Helvetica Neue", Arial, sans-serif; font-size: 2.8125rem; line-height: 3.25rem; font-weight: 600; letter-spacing: .015rem; }
    .wallet-price .yuan { font-size: 1.875rem; }
    .payment-method { height: 7.125rem; margin: 0 1.3125rem; padding-top: .9375rem; }
    .method-heading { display: flex; justify-content: space-between; align-items: center; color: #858585; font-size: 1rem; line-height: 1.75rem; }
    .change-method { display: flex; align-items: center; gap: .4375rem; color: inherit; }
    .change-method .chevron { width: .4375rem; height: .4375rem; border-width: 1px; }
    .cash-card { display: flex; align-items: center; gap: .6875rem; height: 3.9375rem; margin-top: .4375rem; padding: 0 1.125rem; border-radius: .375rem; background: #2c2518; color: #a6a28e; font-size: 1rem; }
    .coin { display: grid; place-items: center; width: 1.375rem; height: 1.375rem; border: .1875rem solid #ffda24; border-radius: 50%; color: #f2c510; background: #ffe768; font-size: 1rem; font-weight: 600; line-height: 1; }
    .check { width: 1.3125rem; height: 1.125rem; margin-left: auto; color: #07b565; }
    .pin-area { height: 6.1875rem; display: flex; align-items: center; justify-content: center; padding-bottom: .1875rem; }
    .pin-dots { display: grid; grid-template-columns: repeat(6, 2.8125rem); gap: .5625rem; }
    .pin-cell { display: grid; place-items: center; width: 2.8125rem; height: 2.8125rem; border-radius: .3125rem; background: #252525; }
    .pin-cell.filled::after { content: ""; width: .5625rem; height: .5625rem; background: #cfcfcf; border-radius: 50%; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 3.875rem); background: #111; border-top: 1px solid #262626; }
    .key { display: flex; align-items: center; justify-content: center; border-right: 1px solid #242424; border-bottom: 1px solid #242424; background: #1a1a1a; color: #cecece; font-size: 1.75rem; line-height: 1; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 400; }
    .key:nth-child(3n) { border-right: 0; }
    .key.empty, .key.delete { background: #111; border-bottom-color: #111; }
    .key.delete { border-right: 0; }
    .delete-icon { width: 1.4375rem; height: 1.1875rem; }
    .wallet-safe-bottom { height: 1.25rem; background: #111; }
    .info-sheet { padding-bottom: 2rem; }
    .info-sheet .sheet-header { display: flex; align-items: center; justify-content: center; font-size: 1.0625rem; }
    .info-content { padding: 1.75rem 2rem; font-size: 1rem; line-height: 1.75; }
    .info-content p { margin: 0; color: #a9a9a9; font-size: .8125rem; }
    .toast { position: absolute; z-index: 30; left: 50%; top: 46%; transform: translate(-50%, -50%); max-width: 86%; padding: .875rem 1.125rem; border-radius: .5rem; background: rgba(56, 56, 56, .96); color: #eee; font-size: .875rem; line-height: 1.5; text-align: center; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes rise { from { transform: translateY(15%); opacity: .7; } to { transform: translateY(0); opacity: 1; } }
    @media (max-height: 580px) { .actions { bottom: 1rem; gap: .625rem; } }
    .app.keyboard-open .actions { right: 2rem; left: 2rem; bottom: calc(var(--keyboard-inset, 0px) + .5rem); gap: 1.125rem; }
    .app.keyboard-open .amount-card { min-height: 0; }
    .app.keyboard-compact .navigation { flex-basis: 3rem; }
    .app.keyboard-compact .merchant { flex-basis: 4rem; padding-top: .25rem; padding-bottom: .5rem; }
    .app.keyboard-compact .merchant h2 { font-size: 1.375rem; line-height: 2rem; }
    .app.keyboard-compact .amount-card { padding-top: 1rem; }
    .app.keyboard-compact .actions { gap: .5rem; }
    .app.keyboard-compact .pill { height: 2.75rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="page merchant-page" id="merchantPage" aria-label="向商家付款">
      <header class="navigation">
        <button type="button" class="back" id="backButton" aria-label="返回">
          <svg viewBox="0 0 30 20" fill="none" stroke="currentColor"><path d="M10 1 1 10l9 9M1 10h29"/></svg>
        </button>
        <h1>向商家付款</h1>
      </header>
      <section class="merchant">
        <h2 id="merchantName">宇池餐饮</h2>
        <button type="button" class="merchant-info" id="merchantInfo">商家公示信息<span class="chevron" aria-hidden="true"></span></button>
      </section>
      <section class="amount-card" aria-label="付款金额">
        <label class="amount-field" for="amountInput">
          <span class="currency" aria-hidden="true">¥</span>
          <span class="sr-only">付款金额（元）</span>
          <input class="amount-input" id="amountInput" type="text" inputmode="decimal" autocomplete="off" maxlength="10" spellcheck="false" aria-label="付款金额（元）">
        </label>
      </section>
      <div class="actions">
        <button type="button" class="pill direct" id="directPay" disabled>
          <span class="button-title">直接付款</span>
          <span class="button-caption">不记录订单，不享有相关权益</span>
        </button>
        <button type="button" class="pill login" id="loginPay" disabled>登录并付款</button>
      </div>
    </section>

    <section class="page order-page" id="orderPage" aria-label="订单确认" hidden>
      <dl class="order-details">
        <div class="detail-row"><dt>商品名称</dt><dd id="productName">美餐网–收银台支付</dd></div>
        <div class="detail-row"><dt>时间</dt><dd id="orderTime"></dd></div>
        <div class="detail-row"><dt>交易金额</dt><dd id="orderAmount">¥15.0</dd></div>
      </dl>
      <button type="button" class="order-pay" id="orderPay">支付</button>
    </section>

    <section class="page success-page" id="successPage" aria-label="支付成功演示" hidden>
      <div class="success-content">
        <div class="success-hero">
          <div class="success-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="currentColor"/><path d="m18 32 9 9 20-20" stroke="#252525" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <h1 class="success-title" id="successTitle" tabindex="-1">支付成功</h1>
          <p class="success-merchant" id="successMerchant">宇池餐饮</p>
          <div class="success-amount"><span class="yuan">¥</span><span id="successAmount">15.00</span></div>
        </div>
        <dl class="success-details">
          <div class="detail-row"><dt>商品名称</dt><dd id="successProduct">美餐网–收银台支付</dd></div>
          <div class="detail-row"><dt>付款方式</dt><dd>零钱</dd></div>
          <div class="detail-row"><dt>支付时间</dt><dd id="successTime"></dd></div>
        </dl>
      </div>
      <footer class="success-footer">
        <button type="button" class="pill success-finish" id="completeButton">完成</button>
      </footer>
    </section>

    <section class="overlay" id="choiceOverlay" hidden aria-label="选择付款方式">
      <button type="button" class="scrim" data-close="choice" aria-label="关闭付款方式"></button>
      <section class="sheet choice-sheet" role="dialog" aria-modal="true" aria-labelledby="choiceTitle" tabindex="-1">
        <header class="sheet-header">
          <span class="sr-only" id="choiceTitle">选择付款方式</span>
          <button type="button" class="close" data-close="choice" aria-label="关闭">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round"><path d="m2 2 16 16M18 2 2 18"/></svg>
          </button>
        </header>
        <div class="pending"><span>待支付</span><span class="pending-amount" id="pendingAmount">¥15.0</span></div>
        <button type="button" class="wechat-button" id="wechatPay">
          <span class="wechat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C5.9 2 1 6.2 1 11.4c0 2.8 1.5 5.3 4 7l-.9 3.3 3.7-1.8c1.3.5 2.7.7 4.2.7 6.1 0 11-4.2 11-9.3S18.1 2 12 2Z"/><path fill="#0eba0f" d="m5.2 10.2 3.3 5.2 13-8.8-1.1-1.3L9.3 11.6 6.6 8.9Z"/></svg></span>
          <span>微信</span>
        </button>
      </section>
    </section>

    <section class="overlay wallet-overlay" id="walletOverlay" hidden aria-label="支付面板演示">
      <button type="button" class="scrim" data-close="wallet" aria-label="关闭支付面板"></button>
      <section class="sheet wallet-sheet" role="dialog" aria-modal="true" aria-labelledby="walletTitle" aria-describedby="demoNote" tabindex="-1">
        <p class="sr-only" id="demoNote">这是本地界面演示，演示密码为159753。请勿输入真实支付密码；输入只在当前页面内存中校验，不保存或提交，也不会发起支付。</p>
        <button type="button" class="close wallet-close" data-close="wallet" aria-label="关闭支付面板">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="m2 2 16 16M18 2 2 18"/></svg>
        </button>
        <div class="wallet-heading">
          <h2 id="walletTitle">美餐</h2>
          <div class="wallet-price"><span class="yuan">¥</span><span id="walletAmount">15.00</span></div>
        </div>
        <section class="payment-method" aria-label="付款方式">
          <div class="method-heading"><span>付款方式</span><button type="button" class="change-method" id="changeMethod">更改<span class="chevron" aria-hidden="true"></span></button></div>
          <div class="cash-card"><span class="coin" aria-hidden="true">¥</span><span>零钱</span><span class="check" aria-hidden="true"><svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 10 7 7L23 2"/></svg></span></div>
        </section>
        <div class="pin-area"><div class="pin-dots" role="img" aria-label="已输入 0 位演示圆点" id="pinDots"><span class="pin-cell"></span><span class="pin-cell"></span><span class="pin-cell"></span><span class="pin-cell"></span><span class="pin-cell"></span><span class="pin-cell"></span></div></div>
        <div class="keypad" id="keypad" aria-label="演示数字键盘">
          <button type="button" class="key" data-digit>1</button><button type="button" class="key" data-digit>2</button><button type="button" class="key" data-digit>3</button>
          <button type="button" class="key" data-digit>4</button><button type="button" class="key" data-digit>5</button><button type="button" class="key" data-digit>6</button>
          <button type="button" class="key" data-digit>7</button><button type="button" class="key" data-digit>8</button><button type="button" class="key" data-digit>9</button>
          <span class="key empty" aria-hidden="true"></span><button type="button" class="key" data-digit>0</button>
          <button type="button" class="key delete" id="deleteKey" aria-label="删除一位"><span class="delete-icon"><svg viewBox="0 0 26 21"><path fill="currentColor" d="M10 1h14a1 1 0 0 1 1 1v17a1 1 0 0 1-1 1H10L1 10.5Z"/><path stroke="#111" stroke-width="1.6" d="m11 6 9 9m0-9-9 9"/></svg></span></button>
        </div>
        <div class="wallet-safe-bottom"></div>
      </section>
    </section>

    <section class="overlay" id="infoOverlay" hidden aria-label="商家公示信息">
      <button type="button" class="scrim" data-close="info" aria-label="关闭商家信息"></button>
      <section class="sheet info-sheet" role="dialog" aria-modal="true" aria-labelledby="infoTitle" tabindex="-1">
        <header class="sheet-header"><span id="infoTitle">商家公示信息</span><button type="button" class="close" data-close="info" aria-label="关闭"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="m2 2 16 16M18 2 2 18"/></svg></button></header>
        <div class="info-content"><div id="infoMerchantName">宇池餐饮</div><p>界面演示，商家资料以实际公示信息为准。</p></div>
      </section>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </main>
  <script>
    (() => {
      'use strict';
      // 可修改这里的展示文案；所有交互都在浏览器本地完成。
      const CONFIG = {
        merchant: '宇池餐饮',
        product: '美餐网–收银台支付',
        payee: '美餐',
        timeZone: 'Asia/Shanghai',
        demoPassword: '159753'
      };
      const $ = id => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const overlays = { choice: $('choiceOverlay'), wallet: $('walletOverlay'), info: $('infoOverlay') };
      const pages = { merchant: $('merchantPage'), order: $('orderPage'), success: $('successPage') };
      let activeOverlay = null;
      let returnFocus = null;
      let pinValue = ''; // 仅在页面内存中校验固定演示密码，关闭或校验完成即清空。
      let toastTimer;
      let completionTimer;
      let amount = '';
      let transactionTime = '';

      $('merchantName').textContent = CONFIG.merchant;
      $('infoMerchantName').textContent = CONFIG.merchant;
      $('productName').textContent = CONFIG.product;
      $('walletTitle').textContent = CONFIG.payee;
      $('successMerchant').textContent = CONFIG.merchant;
      $('successProduct').textContent = CONFIG.product;
      const timeFormatter = new Intl.DateTimeFormat('zh-CN', {
        timeZone: CONFIG.timeZone,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
      });
      function formatCurrentTime() {
        const parts = Object.fromEntries(timeFormatter.formatToParts(new Date()).map(part => [part.type, part.value]));
        return `${parts.year}–${parts.month}–${parts.day} ${parts.hour}:${parts.minute}:${parts.second}`;
      }
      function recordTransactionTime() {
        transactionTime = formatCurrentTime();
        $('orderTime').textContent = transactionTime;
      }

      // 跟随键盘实际占用的可视区域；页面已缩小时不再重复加键盘高度。
      const viewport = window.visualViewport;
      let viewportBaseline = window.innerHeight;
      let viewportWidth = window.innerWidth;
      let amountKeyboardSession = false;
      let rotatedKeyboardHeight = null;
      let keyboardFrame = 0;
      function resetKeyboardLayout() {
        amountKeyboardSession = false;
        rotatedKeyboardHeight = null;
        $('app').classList.remove('keyboard-open', 'keyboard-compact');
        $('app').style.setProperty('--keyboard-inset', '0px');
      }
      function syncKeyboardLayout() {
        keyboardFrame = 0;
        const focused = document.activeElement === $('amountInput');
        const visibleHeight = viewport ? viewport.height : window.innerHeight;
        const visibleTop = viewport ? viewport.offsetTop : 0;
        const scale = viewport ? viewport.scale : 1;
        if (Math.abs(window.innerWidth - viewportWidth) > 60) {
          rotatedKeyboardHeight = amountKeyboardSession && $('app').classList.contains('keyboard-open') ? visibleHeight : null;
          viewportWidth = window.innerWidth;
          viewportBaseline = Math.max(window.innerHeight, visibleHeight);
        }
        if (rotatedKeyboardHeight !== null) {
          if (visibleHeight - rotatedKeyboardHeight > 100) {
            rotatedKeyboardHeight = null;
            viewportBaseline = Math.max(window.innerHeight, visibleHeight);
          } else rotatedKeyboardHeight = Math.min(rotatedKeyboardHeight, visibleHeight);
        }
        const appBottom = $('app').getBoundingClientRect().bottom;
        const inset = Math.max(0, appBottom - visibleTop - visibleHeight);
        const threshold = Math.max(80, viewportBaseline * .12);
        const reduced = viewportBaseline - visibleHeight > threshold || inset > threshold || rotatedKeyboardHeight !== null;
        const keyboardOpen = amountKeyboardSession && !activeOverlay && !pages.merchant.hidden && Math.abs(scale - 1) < .05 && reduced;
        $('app').classList.toggle('keyboard-open', keyboardOpen);
        $('app').classList.toggle('keyboard-compact', keyboardOpen && visibleHeight < 360);
        $('app').style.setProperty('--keyboard-inset', keyboardOpen ? `${Math.round(inset)}px` : '0px');
        // blur 早于按钮 click；等视口恢复再结束会话，避免按钮先移走。
        if (!focused && !reduced) amountKeyboardSession = false;
        if (!amountKeyboardSession && Math.abs(scale - 1) < .05) viewportBaseline = Math.max(window.innerHeight, visibleHeight);
      }
      function scheduleKeyboardLayout() {
        if (!keyboardFrame) keyboardFrame = requestAnimationFrame(syncKeyboardLayout);
      }
      $('amountInput').addEventListener('focus', () => {
        if (!amountKeyboardSession) viewportBaseline = Math.max(viewportBaseline, window.innerHeight, viewport ? viewport.height : 0);
        amountKeyboardSession = true;
        scheduleKeyboardLayout();
      });
      $('amountInput').addEventListener('blur', scheduleKeyboardLayout);
      window.addEventListener('resize', scheduleKeyboardLayout, { passive: true });
      window.addEventListener('scroll', scheduleKeyboardLayout, { passive: true });
      viewport?.addEventListener('resize', scheduleKeyboardLayout, { passive: true });
      viewport?.addEventListener('scroll', scheduleKeyboardLayout, { passive: true });
      syncKeyboardLayout();

      function cleanAmount(value) {
        let next = value.replace(/[^\d.]/g, '');
        const point = next.indexOf('.');
        if (point !== -1) next = next.slice(0, point + 1) + next.slice(point + 1).replace(/\./g, '').slice(0, 2);
        if (next.startsWith('.')) next = '0' + next;
        const pieces = next.split('.');
        pieces[0] = pieces[0].replace(/^0+(?=\d)/, '').slice(0, 6);
        return pieces.join('.');
      }

      function setAmount(value) {
        amount = cleanAmount(value);
        $('amountInput').value = amount;
        const valid = Number(amount) > 0;
        $('directPay').disabled = !valid;
        $('loginPay').disabled = !valid;
        const numeric = Number(amount) || 0;
        const short = numeric.toFixed(2).replace(/0$/, '');
        $('pendingAmount').textContent = '¥' + short;
        $('orderAmount').textContent = '¥' + short;
        $('walletAmount').textContent = numeric.toFixed(2);
        $('successAmount').textContent = numeric.toFixed(2);
      }

      function notify(message, duration = 2100) {
        clearTimeout(toastTimer);
        $('toast').textContent = message;
        $('toast').hidden = false;
        toastTimer = setTimeout(() => { $('toast').hidden = true; }, duration);
      }

      function renderPin() {
        [...$('pinDots').children].forEach((cell, index) => cell.classList.toggle('filled', index < pinValue.length));
        $('pinDots').setAttribute('aria-label', `已输入 ${pinValue.length} 位演示密码`);
      }

      function setPage(page) {
        Object.entries(pages).forEach(([name, element]) => { element.hidden = name !== page; });
        $('app').dataset.page = page;
        resetKeyboardLayout();
      }

      function openOverlay(name, focus = true) {
        if (activeOverlay) closeOverlay(false);
        returnFocus = document.activeElement;
        document.activeElement?.blur();
        activeOverlay = name;
        resetKeyboardLayout();
        Object.values(pages).forEach(page => { page.inert = true; });
        overlays[name].hidden = false;
        if (name === 'wallet') {
          pinValue = '';
          clearTimeout(completionTimer);
          renderPin();
        }
        if (focus) overlays[name].querySelector('[role="dialog"]').focus({ preventScroll: true });
      }

      function closeOverlay(restoreFocus = true) {
        if (!activeOverlay) return;
        clearTimeout(completionTimer);
        overlays[activeOverlay].hidden = true;
        activeOverlay = null;
        Object.values(pages).forEach(page => { page.inert = false; });
        pinValue = '';
        renderPin();
        if (restoreFocus && returnFocus && !returnFocus.closest('[hidden]')) returnFocus.focus({ preventScroll: true });
      }

      function openChoice() {
        if (!(Number(amount) > 0)) return;
        openOverlay('choice');
      }

      $('amountInput').addEventListener('input', event => setAmount(event.target.value));
      $('amountInput').addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); $('amountInput').blur(); openChoice(); }
      });
      $('directPay').addEventListener('click', openChoice);
      // 截图没有登录表单，按钮直接演示相同付款弹层，不采集账号。
      $('loginPay').addEventListener('click', openChoice);
      $('merchantInfo').addEventListener('click', () => openOverlay('info'));
      document.querySelectorAll('[data-close]').forEach(button => button.addEventListener('click', () => closeOverlay()));
      $('wechatPay').addEventListener('click', () => {
        recordTransactionTime();
        closeOverlay(false);
        setPage('order');
        $('orderPay').focus({ preventScroll: true });
      });
      $('orderPay').addEventListener('click', () => {
        if (!transactionTime) recordTransactionTime();
        openOverlay('wallet');
      });
      $('changeMethod').addEventListener('click', () => notify('演示付款方式：零钱'));
      $('backButton').addEventListener('click', () => {
        if (amount) setAmount('');
        else notify('当前已是演示首页');
      });
      $('completeButton').addEventListener('click', () => {
        setAmount('');
        transactionTime = '';
        $('orderTime').textContent = '';
        $('successTime').textContent = '';
        setPage('merchant');
        $('backButton').focus({ preventScroll: true });
      });

      function handlePinKey(key) {
        if (activeOverlay !== 'wallet') return;
        if (key === 'Backspace' || key === 'Delete') {
          clearTimeout(completionTimer);
          pinValue = pinValue.slice(0, -1);
        } else if (/^\d$/.test(key)) {
          if (pinValue.length >= 6) return;
          clearTimeout(toastTimer);
          $('toast').hidden = true;
          pinValue += key;
          if (pinValue.length === 6) completionTimer = setTimeout(() => {
            if (activeOverlay !== 'wallet' || pinValue.length !== 6) return;
            if (pinValue !== CONFIG.demoPassword) {
              pinValue = '';
              renderPin();
              notify('密码错误，请重新输入');
              return;
            }
            $('successTime').textContent = transactionTime || formatCurrentTime();
            closeOverlay(false);
            setPage('success');
            $('successTitle').focus({ preventScroll: true });
          }, 350);
        }
        renderPin();
      }
      $('keypad').addEventListener('click', event => {
        if (event.target.closest('#deleteKey')) handlePinKey('Backspace');
        else {
          const digitButton = event.target.closest('[data-digit]');
          if (digitButton) handlePinKey(digitButton.textContent.trim());
        }
      });
      document.addEventListener('keydown', event => {
        if (!activeOverlay) return;
        if (event.key === 'Escape') { event.preventDefault(); closeOverlay(); return; }
        if (activeOverlay === 'wallet' && !event.ctrlKey && !event.metaKey && !event.altKey && (/^\d$/.test(event.key) || event.key === 'Backspace' || event.key === 'Delete')) {
          event.preventDefault();
          if (!event.repeat) handlePinKey(event.key);
          return;
        }
        if (event.key === 'Tab') {
          const items = [...overlays[activeOverlay].querySelectorAll('[role="dialog"] button:not(:disabled)')];
          if (!items.length) return;
          const first = items[0], last = items[items.length - 1];
          if (event.shiftKey && (document.activeElement === first || document.activeElement.getAttribute('role') === 'dialog')) { event.preventDefault(); last.focus(); }
          else if (!event.shiftKey && (document.activeElement === last || document.activeElement.getAttribute('role') === 'dialog')) { event.preventDefault(); first.focus(); }
        }
      });
      // 直达截图状态：?screen=empty|amount|method|order|wallet&amount=15
      const screen = params.get('screen') || 'empty';
      setAmount(params.get('amount') || (screen === 'empty' ? '' : '15'));
      setPage(['order', 'wallet'].includes(screen) ? 'order' : 'merchant');
      if (['order', 'wallet'].includes(screen)) recordTransactionTime();
      if (screen === 'method') openOverlay('choice');
      if (screen === 'wallet') openOverlay('wallet');
    })();
  </script>
</body>
</html>
